version: '3.8'

services:
  backend:
    build: ./backend
    container_name: qumail-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./qumail.db
    volumes:
      - ./backend/qumail.db:/app/qumail.db # Persist DB
      
  frontend:
    build: ./frontend
    container_name: qumail-frontend
    ports:
      - "3000:80" # Map host 3000 to nginx 80
    depends_on:
      - backend
